<text x="20" y="32" font-size="3.2">A4 paper. Print at 100% / Actual size. Turn off Fit to page.</text>
<text x="20" y="39" font-size="3.2">Cut around the dashed outline. Preserve the complete white margin.</text>
<text x="20" y="51" font-size="3.8" font-weight="700">ArUco DICT_4X4_50 / ID 0</text>
